# RTKLIB demo5 (rnx2rtkp -k) settings for post-processing the L3's rover log against a base RINEX.
# Kinematic, combined forward+backward, GPS+GLONASS+Galileo+BeiDou, L1+L2+L5, fix-and-hold with AR filter.
# Base position: pass on the command line with -r x y z (from tools/rtb-base.ts); it overrides ant2-pos below.
# G3 flight (14 Oct 2026, RS4 base 1.5 km away): l1+l2 fixed 60 % of epochs, elevation mask 20 fixed 93 %,
# l1+l2+l5 fixed 100 %; fixed and float epochs both agreed with the aircraft's RTK to 1 cm horizontal, 2–4 cm vertical.
pos1-posmode       =kinematic
pos1-frequency     =l1+l2+l5
pos1-soltype       =combined
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-posopt1       =off
pos1-posopt2       =off
pos1-posopt3       =off
pos1-posopt4       =off
pos1-posopt5       =off
pos1-posopt6       =off
pos1-exclsats      =
pos1-navsys        =45
pos2-armode        =fix-and-hold
pos2-varholdamb    =0.1
pos2-gloarmode     =autocal
pos2-gloarmode_r   =autocal
pos2-bdsarmode     =on
pos2-arfilter      =on
pos2-arthres       =3
pos2-arthresmin    =3
pos2-arthresmax    =3
pos2-arthres1      =0.1
pos2-arlockcnt     =0
pos2-minfixsats    =4
pos2-minholdsats   =5
pos2-mindropsats   =10
pos2-rcvstds       =off
pos2-arelmask      =15
pos2-arminfix      =20
pos2-armaxiter     =1
pos2-elmaskhold    =15
pos2-aroutcnt      =20
pos2-maxage        =30
pos2-syncsol       =off
pos2-slipthres     =0.05
pos2-rejionno      =1
pos2-rejgdop       =30
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0
out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =off
out-timesys        =gpst
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-fieldsep       =
out-outsingle      =off
out-maxsolstd      =0
out-height         =ellipsoidal
out-geoid          =internal
out-solstatic      =all
out-nmeaintv1      =0
out-nmeaintv2      =0
out-outstat        =off
stats-eratio1      =300
stats-eratio2      =300
stats-eratio5      =300
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =1
stats-snrmax       =52
stats-errsnr       =0
stats-errrcv       =0
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =3
stats-prnaccelv    =1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-prnpos       =0
stats-clkstab      =5e-12
ant1-postype       =llh
ant1-anttype       =
ant1-antdele       =0
ant1-antdeln       =0
ant1-antdelu       =0
ant2-postype       =xyz
ant2-anttype       =
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =0
ant2-maxaveep      =1
ant2-initrst       =on
misc-timeinterp    =on
misc-sbasatsel     =0
misc-rnxopt1       =
misc-rnxopt2       =
misc-pppopt        =
